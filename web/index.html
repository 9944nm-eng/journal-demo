<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Журнал трейдера</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23121419'/><rect x='8' y='13' width='4' height='11' rx='1' fill='%23eceef1'/><rect x='14' y='7' width='4' height='17' rx='1' fill='%233b76f6'/><rect x='20' y='15' width='4' height='9' rx='1' fill='%23eceef1'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // тема до отрисовки, чтобы не мигало: как в Windows, тёмная или светлая
  (function () {
    var t = localStorage.getItem("theme") || "system";
    var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="3.5" height="10" rx="1" class="b1"/><rect x="10.25" y="4" width="3.5" height="16" rx="1" class="b2"/><rect x="16.5" y="12" width="3.5" height="8" rx="1" class="b3"/></svg>
      <span>Журнал</span>
      <button class="collapse-btn" id="collapseBtn" type="button" aria-label="Свернуть меню" title="Свернуть меню">«</button>
    </div>
    <nav aria-label="Разделы">
      <a href="#/" data-view="today">Сегодня</a>
      <a href="#/trades" data-view="trades">Сделки <span class="count" id="reviewCount" title="Сделки без разбора"></span></a>
      <a href="#/analytics" data-view="analytics">Аналитика</a>
      <a href="#/ts" data-view="strategy">Стратегия</a>
      <a href="#/accounts" data-view="accounts">Счета</a>
    </nav>
    <div class="rail-foot">
      <a href="#/settings" data-view="settings" id="settingsLink">Настройки</a>
      <div class="ro-note" title="Журнал только читает данные MT5: никаких торговых функций">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span>MT5 только чтение. Журнал не торгует.</span>
      </div>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="page-tools hidden" id="pageTools">
        <div class="periods" id="periods" role="tablist" aria-label="Период">
          <button data-p="7">Неделя</button>
          <button data-p="30">Месяц</button>
          <button data-p="90">Квартал</button>
          <button data-p="365">Год</button>
          <button data-p="0">Всё время</button>
        </div>
        <div class="seg units" id="unitSeg" title="Единицы результата"><button data-u="R">R</button><button data-u="$">$</button><button data-u="%">%</button></div>
      </div>
      <div class="top-right">
        <a class="live-pill hidden" id="livePill" href="#/" title="Открытые позиции сейчас"></a>
        <div class="pop-wrap">
          <button class="top-btn" id="accBtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="dot" aria-hidden="true"></span><span id="accLabel">Счёт</span>
            <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="pop hidden" id="accPop" style="width:300px"></div>
        </div>
        <div class="pop-wrap">
          <button class="top-btn ghost" id="syncBtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="sync-dot" id="syncDot" aria-hidden="true"></span><span id="syncStatus">синхронизация</span></button>
          <div class="pop hidden" id="syncPop" style="width:360px"></div>
        </div>
        <button class="top-btn ghost" id="cmdBtn" type="button" title="Поиск и команды (Ctrl+K)">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Поиск</span><kbd>Ctrl K</kbd></button>
        <div class="pop-wrap">
          <button class="top-btn icon ghost" id="menuBtn" type="button" aria-label="Меню" aria-haspopup="true" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
          <div class="pop hidden" id="menuPop" style="width:330px">
            <h3>Скачать</h3>
            <a class="menu-item" id="expPack" href="#">Пакет для разбора в чате<small>JSON</small></a>
            <a class="menu-item" id="expPackZip" href="#">Пакет со скриншотами<small>ZIP</small></a>
            <a class="menu-item" id="expXlsx" href="#">Сделки, разборы, статистика<small>Excel</small></a>
            <a class="menu-item" id="expHtml" href="#">Отчёт со скриншотами<small>HTML</small></a>
            <a class="menu-item" id="expHtml2" href="#">Отчёт без скриншотов<small>HTML</small></a>
            <a class="menu-item" id="expCsv" href="#">Только сделки<small>CSV</small></a>
            <div class="menu-sep"></div>
            <h3>Тема</h3>
            <div class="seg" id="themeSeg" style="margin:0 6px 6px"><button data-t="system">Как в Windows</button><button data-t="dark">Тёмная</button><button data-t="light">Светлая</button></div>
            <div class="menu-sep"></div>
            <a class="menu-item" href="#/settings">Настройки</a>
          </div>
        </div>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="motion.js"></script>
<script src="help.js"></script>
<script src="accounts.js"></script>
<script src="dashboard.js"></script>
<script src="market.js"></script>
<script src="cot.js"></script>
<script src="settings.js"></script>
<script src="day.js"></script>
<script src="library.js"></script>
<script src="analysis.js"></script>
<script src="week.js"></script>
<script src="live.js"></script>
<script src="poschart.js"></script>
<script src="share.js"></script>
<script src="ts.js"></script>
<script src="backtest.js"></script>
<script src="replay.js"></script>
<script src="portfolio.js"></script>
<script src="today.js"></script>
<script src="sleep.js"></script>
<script src="review.js"></script>
<script src="quick.js"></script>
<script src="app.js"></script>
</body>
</html>
